name: reel-arabic-word
on:
  schedule:
    - cron: "0 7 * * 1,3,5"   # 07:00 UTC = 12:00 PM Pakistan time, Mon/Wed/Fri
  workflow_dispatch:
permissions:
  contents: write
concurrency: daily-post
jobs:
  reel:
    runs-on: ubuntu-latest
    env:
      IG_HANDLE: ${{ vars.IG_HANDLE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Render Reel
        run: python main.py reel-prepare
      - name: Push video so Instagram can fetch it
        run: |
          git config user.name "arabic-bot"; git config user.email "bot@users.noreply.github.com"
          git add reels && (git diff --cached --quiet || git commit -m "prepare reel") && git pull --rebase && git push
      - name: Publish Reel
        run: python main.py reel-publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - name: Save posted status
        run: |
          git add reels && (git diff --cached --quiet || git commit -m "mark reel posted") && git pull --rebase && git push || true
